<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1010" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5f6368"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#00897B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#D93025"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa0a6"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#AD1457"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="26" font-weight="700" fill="#202124">Contineo — architektura a datový tok</text>
  <text x="40" y="74" font-size="14" fill="#5f6368">Zdroje · zpracování · review → MongoDB (jádro) → AI adaptéry → kanály. Adaptéry se vybírají konfigurací tenanta, ne kódem.</text>

  <rect x="300" y="96" width="600" height="34" rx="17" fill="#F1F3F4" stroke="#dadce0"/>
  <text x="600" y="118" font-size="13" fill="#3c4043" text-anchor="middle">Zdroj identity a CRM (osoby, jednotky, role) · auto-zakládání uživatelů</text>
  <path d="M760,130 L760,228" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>

  <!-- KONEKTORY (ADR-029) — živý zdroj pri otázke, nejde cez CMS -->
  <rect x="919" y="88" width="557" height="54" rx="14" fill="#FCE4EC" stroke="#AD1457" stroke-width="1.5"/>
  <text x="939" y="110" font-size="12.5" font-weight="700" fill="#AD1457" textLength="293" lengthAdjust="spacingAndGlyphs">KONEKTORY (MCP) — živý zdroj, mimo knihovnu</text>
  <text x="939" y="129" font-size="10.5" fill="#5f6368" textLength="348" lengthAdjust="spacingAndGlyphs">při otázce souběžně s knihovnou → rerank · citace „živý zdroj, neověřeno“</text>
  <path d="M1051,142 L1051,228" stroke="#AD1457" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowPink)"/>

  <!-- CMS ako vrstva nad kanálmi a workerom -->
  <rect x="26" y="170" width="586" height="524" rx="18"
        fill="#F7F9FE" stroke="#1A73E8" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="46" y="196" font-size="15" font-weight="700" fill="#174EA6" textLength="186" lengthAdjust="spacingAndGlyphs">CMS — SPRÁVA OBSAHU</text>
  <text x="46" y="215" font-size="11" fill="#5f6368" textLength="307" lengthAdjust="spacingAndGlyphs">jediné místo pravdy pro obsah — knihovna, verze, tagy, review</text>

  <!-- ZDROJE -->
  <rect x="40" y="236" width="264" height="372" rx="14" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="60" y="266" font-size="15" font-weight="700" fill="#174EA6" textLength="61" lengthAdjust="spacingAndGlyphs">ZDROJE</text>
  <text x="60" y="285" font-size="11" fill="#5f6368" textLength="187" lengthAdjust="spacingAndGlyphs">dnes: soubory, FAQ, schránka (Graph)</text>
  <g font-size="12.5" fill="#202124">
    <text x="60" y="316" textLength="226" lengthAdjust="spacingAndGlyphs">• Nahrané soubory — PDF + Word/Excel</text>
    <text x="60" y="342" fill="#9aa0a6" textLength="150" lengthAdjust="spacingAndGlyphs">• RSS / web (připravujeme)</text>
    <text x="60" y="368" textLength="143" lengthAdjust="spacingAndGlyphs">• FAQ · ověřené odpovědi</text>
    <text x="60" y="394" textLength="182" lengthAdjust="spacingAndGlyphs">• Schránka helpdesku (Graph) ⇅</text>
    <text x="60" y="420" fill="#9aa0a6" textLength="196" lengthAdjust="spacingAndGlyphs">• Import z konektoru (připravujeme)</text>
    <text x="74" y="440" font-size="11" fill="#9aa0a6" font-style="italic" textLength="159" lengthAdjust="spacingAndGlyphs">článek jako koncept → schválení</text>
    <text x="74" y="457" font-size="11" fill="#9aa0a6" font-style="italic" textLength="123" lengthAdjust="spacingAndGlyphs">pak jako každý dokument</text>
  </g>
  <text x="60" y="496" font-size="11" fill="#1A73E8" textLength="149" lengthAdjust="spacingAndGlyphs">⇅ schránka je i výstupní kanál</text>

  <!-- WORKER -->
  <rect x="333" y="236" width="264" height="372" rx="14" fill="#FEF3E0" stroke="#E8920C" stroke-width="1.5"/>
  <text x="353" y="266" font-size="15" font-weight="700" fill="#B05A00" textLength="68" lengthAdjust="spacingAndGlyphs">WORKER</text>
  <text x="353" y="285" font-size="11" fill="#5f6368" textLength="227" lengthAdjust="spacingAndGlyphs">zpracování mimo DB · bez jazykového modelu</text>
  <g font-size="12.5" fill="#202124">
    <text x="353" y="316" textLength="97" lengthAdjust="spacingAndGlyphs">• Převod souboru</text>
    <text x="367" y="334" font-size="10.5" fill="#5f6368" textLength="183" lengthAdjust="spacingAndGlyphs">PDF se schvaluje · text z Wordu/Excelu</text>
    <text x="367" y="349" font-size="10.5" fill="#5f6368" textLength="140" lengthAdjust="spacingAndGlyphs">sken → ruční přepis modelem</text>
    <text x="353" y="377" textLength="136" lengthAdjust="spacingAndGlyphs">• Členění po článcích / §</text>
    <text x="367" y="395" font-size="10.5" fill="#5f6368" textLength="165" lengthAdjust="spacingAndGlyphs">analyzátor ze signálů navrhne profil</text>
    <text x="367" y="410" font-size="10.5" fill="#5f6368" textLength="166" lengthAdjust="spacingAndGlyphs">FAQ po záznamech · člověk potvrdí</text>
    <text x="353" y="438" textLength="98" lengthAdjust="spacingAndGlyphs">• Metadata úseku</text>
    <text x="367" y="456" font-size="10.5" fill="#5f6368" textLength="187" lengthAdjust="spacingAndGlyphs">companyCode · accessLevel · language</text>
    <text x="367" y="471" font-size="10.5" fill="#5f6368" textLength="178" lengthAdjust="spacingAndGlyphs">versionId · articleRef · druh z číselníku</text>
    <text x="353" y="499" textLength="72" lengthAdjust="spacingAndGlyphs">• Embedding</text>
    <text x="367" y="517" font-size="10.5" fill="#5f6368" textLength="180" lengthAdjust="spacingAndGlyphs">cloud: počítá databáze přímo v indexu</text>
    <text x="367" y="532" font-size="10.5" fill="#5f6368" textLength="140" lengthAdjust="spacingAndGlyphs">on-prem: adaptér Infinity / TEI</text>
    <text x="353" y="560" textLength="39" lengthAdjust="spacingAndGlyphs">• Znění</text>
    <text x="367" y="578" font-size="10.5" fill="#5f6368" textLength="158" lengthAdjust="spacingAndGlyphs">účinnost nese dokument, ne úsek</text>
    <text x="367" y="593" font-size="10.5" fill="#5f6368" textLength="194" lengthAdjust="spacingAndGlyphs">staré členění: superseded, nic se nemaže</text>
  </g>

  <!-- KURÁTORSKÁ BRÁNA (v rámci CMS) -->
  <rect x="40" y="622" width="557" height="58" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="58" y="645" font-size="13.5" font-weight="700" fill="#174EA6" textLength="248" lengthAdjust="spacingAndGlyphs">KURÁTOR — brána před publikováním</text>
  <text x="58" y="666" font-size="11.5" fill="#3c4043" textLength="410" lengthAdjust="spacingAndGlyphs">tagy z číselníku → review → publish · kanál smí jen předvyplnit, publikuje člověk</text>

  <!-- MongoDB JADRO -->
  <rect x="626" y="236" width="264" height="372" rx="14" fill="#E6F4EA" stroke="#137333" stroke-width="2"/>
  <text x="646" y="266" font-size="15" font-weight="700" fill="#0B6E2E" textLength="147" lengthAdjust="spacingAndGlyphs">MongoDB — JÁDRO</text>
  <text x="646" y="285" font-size="11" fill="#5f6368" textLength="146" lengthAdjust="spacingAndGlyphs">stejné dotazy cloud i on-prem</text>
  <g font-size="12.5" fill="#202124">
    <text x="646" y="316" textLength="148" lengthAdjust="spacingAndGlyphs">• $vectorSearch + $search</text>
    <text x="646" y="342" textLength="131" lengthAdjust="spacingAndGlyphs">• $rankFusion — hybrid</text>
    <text x="660" y="360" font-size="10.5" fill="#5f6368" textLength="129" lengthAdjust="spacingAndGlyphs">vektor 60 % + fulltext 40 %</text>
    <text x="646" y="388" textLength="86" lengthAdjust="spacingAndGlyphs">• Filtr před LLM</text>
    <text x="660" y="406" font-size="10.5" fill="#5f6368" textLength="194" lengthAdjust="spacingAndGlyphs">companyCode — vždy první, bez výjimky</text>
    <text x="660" y="421" font-size="10.5" fill="#5f6368" textLength="176" lengthAdjust="spacingAndGlyphs">versionId ∈ znění platná ke dni otázky</text>
    <text x="660" y="436" font-size="10.5" fill="#5f6368" textLength="150" lengthAdjust="spacingAndGlyphs">superseded: false · accessLevel</text>
  </g>
  <line x1="646" y1="448" x2="870" y2="448" stroke="#A8D5B5" stroke-width="1"/>
  <text x="646" y="461" font-size="11.5" fill="#0B6E2E" font-weight="600" textLength="48" lengthAdjust="spacingAndGlyphs">Kolekce:</text>
  <text x="646" y="474" font-size="10" fill="#3c4043" textLength="176" lengthAdjust="spacingAndGlyphs">Obsah: documents · document_chunks</text>
  <text x="646" y="487" font-size="10" fill="#3c4043" textLength="197" lengthAdjust="spacingAndGlyphs">Schvalování: approval_rounds · cms_folders</text>
  <text x="646" y="500" font-size="10" fill="#3c4043" textLength="126" lengthAdjust="spacingAndGlyphs">Lidé: persons · departments</text>
  <text x="646" y="513" font-size="10" fill="#3c4043" textLength="192" lengthAdjust="spacingAndGlyphs">Přidělení: onboarding_tracks · assignments</text>
  <text x="646" y="526" font-size="10" fill="#3c4043" textLength="134" lengthAdjust="spacingAndGlyphs">Potvrzení: acknowledgements</text>
  <text x="646" y="539" font-size="10" fill="#3c4043" textLength="171" lengthAdjust="spacingAndGlyphs">Helpdesk: helpdesk_channels · tickets</text>
  <text x="646" y="552" font-size="10" fill="#3c4043" textLength="176" lengthAdjust="spacingAndGlyphs">Vzdělávání: courses · tests · certificates</text>
  <text x="646" y="565" font-size="10" fill="#3c4043" textLength="167" lengthAdjust="spacingAndGlyphs">Dohled: audit · evaluations · ai_usage</text>
  <line x1="646" y1="574" x2="870" y2="574" stroke="#A8D5B5" stroke-width="1"/>
  <text x="646" y="586" font-size="10" fill="#0B6E2E" textLength="153" lengthAdjust="spacingAndGlyphs">Důkazní záznamy se nemění (D24)</text>
  <text x="646" y="598" font-size="9.5" fill="#5f6368" textLength="194" lengthAdjust="spacingAndGlyphs">oprava = nový záznam · odvolání = revokedAt</text>

  <!-- AI VRSTVA -->
  <rect x="919" y="236" width="264" height="372" rx="14" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
  <text x="939" y="266" font-size="15" font-weight="700" fill="#006064" textLength="181" lengthAdjust="spacingAndGlyphs">AI VRSTVA — ADAPTÉRY</text>
  <text x="939" y="285" font-size="11" fill="#5f6368" textLength="159" lengthAdjust="spacingAndGlyphs">výběr tenant profilem, ne kódem</text>
  <text x="939" y="315" font-size="11.5" font-weight="700" fill="#006064" textLength="71" lengthAdjust="spacingAndGlyphs">EMBEDDING</text>
  <text x="939" y="333" font-size="10.5" fill="#1A73E8" textLength="171" lengthAdjust="spacingAndGlyphs">cloud · Atlas auto-embed (voyage-4)</text>
  <text x="939" y="349" font-size="10.5" fill="#137333" textLength="104" lengthAdjust="spacingAndGlyphs">on-prem · Infinity / TEI</text>
  <text x="939" y="381" font-size="11.5" font-weight="700" fill="#006064" textLength="49" lengthAdjust="spacingAndGlyphs">RERANK</text>
  <text x="939" y="399" font-size="10.5" fill="#1A73E8" textLength="118" lengthAdjust="spacingAndGlyphs">cloud · $rerank (rerank-2)</text>
  <text x="939" y="415" font-size="10.5" fill="#137333" textLength="144" lengthAdjust="spacingAndGlyphs">on-prem · Infinity (BGE-v2-m3)</text>
  <text x="939" y="447" font-size="11.5" font-weight="700" fill="#006064" textLength="76" lengthAdjust="spacingAndGlyphs">GENEROVÁNÍ</text>
  <text x="939" y="465" font-size="10.5" fill="#1A73E8" textLength="137" lengthAdjust="spacingAndGlyphs">cloud · Claude (Citations API)</text>
  <text x="939" y="481" font-size="10.5" fill="#137333" textLength="168" lengthAdjust="spacingAndGlyphs">on-prem · vLLM (Qwen3 / EuroLLM)</text>
  <line x1="939" y1="500" x2="1163" y2="500" stroke="#80DEEA" stroke-width="1"/>
  <text x="939" y="520" font-size="10.5" fill="#5f6368" textLength="129" lengthAdjust="spacingAndGlyphs">Rerank běží nad výsledkem</text>
  <text x="939" y="536" font-size="10.5" fill="#5f6368" textLength="153" lengthAdjust="spacingAndGlyphs">$rankFusion — v pipeline (cloud)</text>
  <text x="939" y="552" font-size="10.5" fill="#5f6368" textLength="122" lengthAdjust="spacingAndGlyphs">nebo v aplikaci (on-prem).</text>

  <!-- KANÁLY -->
  <rect x="1212" y="236" width="264" height="372" rx="14" fill="#EEE9FB" stroke="#6B46C1" stroke-width="1.5"/>
  <text x="1232" y="266" font-size="15" font-weight="700" fill="#54309E" textLength="60" lengthAdjust="spacingAndGlyphs">KANÁLY</text>
  <text x="1232" y="285" font-size="11" fill="#5f6368" textLength="206" lengthAdjust="spacingAndGlyphs">dva typy · odpověď vždy s citací a zněním</text>
  <text x="1232" y="316" font-size="12" font-weight="700" fill="#54309E" textLength="48" lengthAdjust="spacingAndGlyphs">WIDGET</text>
  <text x="1232" y="332" font-size="10.5" fill="#5f6368" textLength="155" lengthAdjust="spacingAndGlyphs">do cizí stránky místo vyhledávání</text>
  <text x="1240" y="354" font-size="12" fill="#202124" textLength="166" lengthAdjust="spacingAndGlyphs">• Asistent — otázka a odpověď</text>
  <text x="1254" y="369" font-size="10.5" fill="#5f6368" textLength="151" lengthAdjust="spacingAndGlyphs">vždy · podepsaná identita (ISSF)</text>
  <text x="1240" y="390" font-size="12" fill="#202124" textLength="100" lengthAdjust="spacingAndGlyphs">• Tickety (volitelně)</text>
  <text x="1254" y="405" font-size="10.5" fill="#5f6368" textLength="195" lengthAdjust="spacingAndGlyphs">eskalace z chatu · fronta řešitele · do FAQ</text>
  <text x="1240" y="426" font-size="12" fill="#202124" textLength="186" lengthAdjust="spacingAndGlyphs">• Schránka helpdesku ⇅ (volitelně)</text>
  <text x="1254" y="441" font-size="10.5" fill="#5f6368" textLength="201" lengthAdjust="spacingAndGlyphs">e-mail = ticket · odpověď e-mailem (Graph)</text>
  <line x1="1232" y1="458" x2="1456" y2="458" stroke="#D7CCF0" stroke-width="1"/>
  <text x="1232" y="480" font-size="12" font-weight="700" fill="#54309E" textLength="48" lengthAdjust="spacingAndGlyphs">PORTÁL</text>
  <text x="1232" y="496" font-size="10.5" fill="#5f6368" textLength="163" lengthAdjust="spacingAndGlyphs">intranet organizace, za přihlášením</text>
  <text x="1240" y="518" font-size="12" fill="#202124" textLength="58" lengthAdjust="spacingAndGlyphs">• Knihovna</text>
  <text x="1254" y="533" font-size="10.5" fill="#5f6368" textLength="158" lengthAdjust="spacingAndGlyphs">asistent · potvrzování · vzdělávání</text>
  <text x="1240" y="554" font-size="12" fill="#9aa0a6" textLength="124" lengthAdjust="spacingAndGlyphs">• Články (připravujeme)</text>
  <text x="1254" y="569" font-size="10.5" fill="#9aa0a6" font-style="italic" textLength="100" lengthAdjust="spacingAndGlyphs">KB články · oznámení</text>
  <text x="1240" y="590" font-size="12" fill="#9aa0a6" textLength="141" lengthAdjust="spacingAndGlyphs">• Formuláře (připravujeme)</text>

  <path d="M304,422 L331,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M597,422 L624,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M890,422 L917,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1183,422 L1210,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M1300,608 C1258,656 1020,664 838,614" fill="none" stroke="#00897B" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
  <path d="M1392,608 C1430,678 1064,686 880,616" fill="none" stroke="#D93025" stroke-width="2.2" marker-end="url(#arrowRed)"/>

  <text x="40" y="742" font-size="15" font-weight="700" fill="#202124">Dva zpětné cykly</text>
  <circle cx="52" cy="766" r="4.5" fill="#00897B"/>
  <text x="66" y="771" font-size="12.5" fill="#00695C"><tspan font-weight="700">① ověřená odpověď</tspan> — zpět do indexu jako úsek (sourceType qa)</text>
  <circle cx="52" cy="792" r="4.5" fill="#D93025"/>
  <text x="66" y="797" font-size="12.5" fill="#B31412"><tspan font-weight="700">② ticket</tspan> — eskalace z chatu nebo widgetu, odpověď e-mailem</text>

  <rect x="40" y="820" width="700" height="88" rx="12" fill="#E0F2F1" stroke="#00897B" stroke-width="1.5"/>
  <text x="60" y="848" font-size="15" font-weight="700" fill="#00695C" textLength="216" lengthAdjust="spacingAndGlyphs">① KURACE — kontrola kvality</text>
  <text x="60" y="872" font-size="12.5" fill="#3c4043" textLength="480" lengthAdjust="spacingAndGlyphs">Hodnotitel připraví znění, správce obsahu ho zveřejní → úsek sourceType qa v indexu.</text>
  <text x="60" y="892" font-size="12" fill="#5f6368" textLength="269" lengthAdjust="spacingAndGlyphs">Není to strojové „učení“, ale lidská kurace obsahu.</text>

  <rect x="776" y="820" width="700" height="88" rx="12" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
  <text x="796" y="848" font-size="15" font-weight="700" fill="#B31412" textLength="185" lengthAdjust="spacingAndGlyphs">② ESKALACE — na ticket</text>
  <text x="796" y="872" font-size="12.5" fill="#3c4043" textLength="551" lengthAdjust="spacingAndGlyphs">Po dvou negativních hodnoceních asistent nabídne ticket; e-mail do schránky kanálu je ticket také.</text>
  <text x="796" y="892" font-size="12.5" fill="#3c4043" textLength="481" lengthAdjust="spacingAndGlyphs">Řešitel dostane návrh odpovědi, upraví ho, odešle e-mailem a může ho přidat do FAQ.</text>

  <text x="40" y="944" font-size="11.5" fill="#9aa0a6">Cloud: MongoDB Atlas EU · Voyage voyage-4 + rerank-2 · Claude API (Citations)  │  On-prem: MongoDB Community 8.2 · Infinity / TEI · vLLM (Qwen3 / EuroLLM)</text>
  <text x="40" y="964" font-size="11.5" fill="#9aa0a6">Jádro je v obou režimech identické — $rankFusion běží i self-hosted. Liší se jen tři adaptéry: embedding, rerank, generování (ADR-001).</text>
  <text x="40" y="984" font-size="11.5" fill="#9aa0a6">Rozdíly: $rerank je zatím Atlas-only · Citations API jen u Claude · auto-embed volá Voyage API, proto pro air-gap nepoužitelné.</text>
</svg>
