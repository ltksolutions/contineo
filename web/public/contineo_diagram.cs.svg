<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1010" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5f6368"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#00897B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#D93025"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="26" font-weight="700" fill="#202124">Contineo — architektura a datový tok</text>
  <text x="40" y="74" font-size="14" fill="#5f6368">CMS (kanály · zpracování · review) → MongoDB (jádro) → AI adaptéry → rozhraní. Adaptéry se vybírají konfigurací tenanta, ne kódem.</text>

  <rect x="470" y="96" width="580" height="34" rx="17" fill="#F1F3F4" stroke="#dadce0"/>
  <text x="760" y="118" font-size="13" fill="#3c4043" text-anchor="middle">Zdroj identity a CRM (osoby, jednotky, role) · auto-zakládání uživatelů</text>
  <path d="M760,130 L760,228" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>

  <!-- CMS ako vrstva nad kanálmi a workerom -->
  <rect x="26" y="170" width="586" height="524" rx="18"
        fill="#F7F9FE" stroke="#1A73E8" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="46" y="196" font-size="15" font-weight="700" fill="#174EA6">CMS — SPRÁVA OBSAHU</text>
  <text x="46" y="215" font-size="11" fill="#5f6368">jediné místo pravdy pro obsah — knihovna, verze, tagy, review</text>

  <!-- VSTUPNÉ KANÁLY -->
  <rect x="40" y="236" width="264" height="372" rx="14" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="60" y="266" font-size="15" font-weight="700" fill="#174EA6">VSTUPNÍ KANÁLY</text>
  <text x="60" y="285" font-size="11" fill="#5f6368">obsah i integrace = jedna vrstva</text>
  <g font-size="12.5" fill="#202124">
    <text x="60" y="316">• PDF normy a směrnice</text>
    <text x="60" y="342">• RSS / web (Obecné info)</text>
    <text x="60" y="368">• FAQ</text>
    <text x="60" y="394">• E-mail (IMAP)  ⇅</text>
    <text x="60" y="420">• MCP konektory</text>
    <text x="74" y="440" font-size="11" fill="#5f6368">Drive · SharePoint · Confluence</text>
    <text x="74" y="457" font-size="11" fill="#5f6368">Notion · Slack …</text>
  </g>
  <text x="60" y="496" font-size="11" fill="#1A73E8">⇅ e-mail je i výstupní kanál</text>

  <!-- WORKER -->
  <rect x="333" y="236" width="264" height="372" rx="14" fill="#FEF3E0" stroke="#E8920C" stroke-width="1.5"/>
  <text x="353" y="266" font-size="15" font-weight="700" fill="#B05A00">WORKER</text>
  <text x="353" y="285" font-size="11" fill="#5f6368">zpracování (mimo DB)</text>
  <g font-size="12.5" fill="#202124">
    <text x="353" y="316">• Chunking — úryvek po §/čl.</text>
    <text x="353" y="350">• Značkování z číselníku:</text>
    <text x="367" y="369" font-size="11" fill="#5f6368">sekce · scope · companyCode</text>
    <text x="367" y="386" font-size="11" fill="#5f6368">verze (effectiveFrom/To)</text>
    <text x="353" y="418">• Embedding při ingesci</text>
    <text x="367" y="437" font-size="11" fill="#5f6368">přes adaptér podle profilu</text>
    <text x="353" y="469">• Verzování — staré chunky</text>
    <text x="367" y="488" font-size="11" fill="#5f6368">isActive:false, nemazat</text>
  </g>

  <!-- KURÁTORSKÁ BRÁNA (v rámci CMS) -->
  <rect x="40" y="622" width="557" height="58" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="58" y="645" font-size="13.5" font-weight="700" fill="#174EA6">KURÁTOR — brána před publikováním</text>
  <text x="58" y="666" font-size="11.5" fill="#3c4043">tagy z číselníku → review → publish · kanál smí jen předvyplnit, publikuje člověk</text>

  <!-- MongoDB JADRO -->
  <rect x="626" y="236" width="264" height="372" rx="14" fill="#E6F4EA" stroke="#137333" stroke-width="2"/>
  <text x="646" y="266" font-size="15" font-weight="700" fill="#0B6E2E">MongoDB — JÁDRO</text>
  <text x="646" y="285" font-size="11" fill="#5f6368">stejné dotazy cloud i on-prem</text>
  <g font-size="12.5" fill="#202124">
    <text x="646" y="316">• $vectorSearch + $search</text>
    <text x="646" y="348">• $rankFusion — hybrid</text>
    <text x="660" y="367" font-size="11" fill="#5f6368">vektor 60 % + fulltext 40 %</text>
    <text x="646" y="397">• Filtr companyCode</text>
    <text x="660" y="416" font-size="11" fill="#5f6368">default-deny, před LLM</text>
    <text x="660" y="431" font-size="10.5" fill="#B31412">hierarchie nedává přístup</text>
  </g>
  <line x1="646" y1="444" x2="870" y2="444" stroke="#A8D5B5" stroke-width="1"/>
  <text x="646" y="460" font-size="11.5" fill="#0B6E2E" font-weight="600">Kolekce:</text>
  <text x="646" y="478" font-size="11" fill="#3c4043">documents (+ versions) · document_chunks</text>
  <text x="646" y="495" font-size="11" fill="#3c4043">channels · channel_runs · navigation</text>
  <text x="646" y="512" font-size="11" fill="#3c4043">categories · qa_pairs · tickets</text>
  <text x="646" y="529" font-size="11" fill="#3c4043">conversations · tenant_profiles</text>
  <text x="646" y="546" font-size="10.5" fill="#3c4043">persons · acknowledgements · onboarding_tracks</text>
  <line x1="646" y1="559" x2="870" y2="559" stroke="#A8D5B5" stroke-width="1"/>
  <text x="646" y="575" font-size="10.5" fill="#0B6E2E">companyCode.parent — hierarchie tenantů</text>
  <text x="646" y="590" font-size="10.5" fill="#5f6368">centrála → dceřiné firmy → provozy</text>

  <!-- AI VRSTVA -->
  <rect x="919" y="236" width="264" height="372" rx="14" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
  <text x="939" y="266" font-size="15" font-weight="700" fill="#006064">AI VRSTVA — ADAPTÉRY</text>
  <text x="939" y="285" font-size="11" fill="#5f6368">výběr tenant profilem, ne kódem</text>
  <text x="939" y="315" font-size="11.5" font-weight="700" fill="#006064">EMBEDDING</text>
  <text x="939" y="333" font-size="10.5" fill="#1A73E8">cloud · Atlas auto-embed (voyage-4)</text>
  <text x="939" y="349" font-size="10.5" fill="#137333">on-prem · Infinity / TEI</text>
  <text x="939" y="381" font-size="11.5" font-weight="700" fill="#006064">RERANK</text>
  <text x="939" y="399" font-size="10.5" fill="#1A73E8">cloud · $rerank (rerank-2)</text>
  <text x="939" y="415" font-size="10.5" fill="#137333">on-prem · Infinity (BGE-v2-m3)</text>
  <text x="939" y="447" font-size="11.5" font-weight="700" fill="#006064">GENEROVÁNÍ</text>
  <text x="939" y="465" font-size="10.5" fill="#1A73E8">cloud · Claude (Citations API)</text>
  <text x="939" y="481" font-size="10.5" fill="#137333">on-prem · vLLM (Qwen3 / EuroLLM)</text>
  <line x1="939" y1="500" x2="1163" y2="500" stroke="#80DEEA" stroke-width="1"/>
  <text x="939" y="520" font-size="10.5" fill="#5f6368">Rerank běží nad výsledkem</text>
  <text x="939" y="536" font-size="10.5" fill="#5f6368">$rankFusion — v pipeline (cloud)</text>
  <text x="939" y="552" font-size="10.5" fill="#5f6368">nebo v aplikaci (on-prem).</text>

  <!-- ROZHRANIA -->
  <rect x="1212" y="236" width="264" height="372" rx="14" fill="#EEE9FB" stroke="#6B46C1" stroke-width="1.5"/>
  <text x="1232" y="266" font-size="15" font-weight="700" fill="#54309E">ROZHRANÍ</text>
  <text x="1232" y="285" font-size="11" fill="#5f6368">odpověď vždy s citací + verzí</text>
  <g font-size="12.5" fill="#202124">
    <text x="1232" y="318">• Chat</text>
    <text x="1246" y="337" font-size="11" fill="#5f6368">streaming, historie konverzace</text>
    <text x="1232" y="369">• E-mail odpovědi  ⇅</text>
    <text x="1246" y="388" font-size="11" fill="#5f6368">IMAP vstup i výstup</text>
    <text x="1232" y="420">• Tickety</text>
    <text x="1246" y="439" font-size="11" fill="#5f6368">helpdesk, SLA, životní cyklus</text>
    <text x="1232" y="471">• Vložený widget</text>
    <text x="1246" y="490" font-size="11" fill="#5f6368">overlay v cizí stránce</text>
    <text x="1232" y="522">• Portál (KB + onboarding)</text>
    <text x="1246" y="541" font-size="11" fill="#5f6368">veřejná KB · potvrzování norem</text>
  </g>

  <path d="M304,422 L331,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M597,422 L624,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M890,422 L917,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1183,422 L1210,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M1300,608 C1258,656 1020,664 838,614" fill="none" stroke="#00897B" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
  <path d="M1392,608 C1430,678 1064,686 880,616" fill="none" stroke="#D93025" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>

  <text x="40" y="742" font-size="15" font-weight="700" fill="#202124">Dva zpětné cykly</text>
  <circle cx="52" cy="766" r="4.5" fill="#00897B"/>
  <text x="66" y="771" font-size="12.5" fill="#00695C"><tspan font-weight="700">① qa_pair</tspan> — schválená odpověď zpět do znalostí</text>
  <circle cx="52" cy="792" r="4.5" fill="#D93025"/>
  <text x="66" y="797" font-size="12.5" fill="#B31412"><tspan font-weight="700">② ticket</tspan> — eskalace s kontextem konverzace</text>

  <rect x="40" y="820" width="700" height="88" rx="12" fill="#E0F2F1" stroke="#00897B" stroke-width="1.5"/>
  <text x="60" y="848" font-size="15" font-weight="700" fill="#00695C">① KURACE — kontrola kvality</text>
  <text x="60" y="872" font-size="12.5" fill="#3c4043">Správce ohodnotí a schválí odpověď → uloží se jako qa_pair → naembeduje zpět.</text>
  <text x="60" y="892" font-size="12" fill="#5f6368">Není to strojové „učení“, ale lidská kurace obsahu.</text>

  <rect x="776" y="820" width="700" height="88" rx="12" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
  <text x="796" y="848" font-size="15" font-weight="700" fill="#B31412">② ESKALACE — na ticket</text>
  <text x="796" y="872" font-size="12.5" fill="#3c4043">Nízké skóre podobnosti nebo 3× neúspěch na totéž téma →</text>
  <text x="796" y="892" font-size="12.5" fill="#3c4043">bot nabídne vytvoření ticketu s celým kontextem konverzace.</text>

  <text x="40" y="944" font-size="11.5" fill="#9aa0a6">Cloud: MongoDB Atlas EU · Voyage voyage-4 + rerank-2 · Claude API (Citations)  │  On-prem: MongoDB Community 8.2 · Infinity / TEI · vLLM (Qwen3 / EuroLLM)</text>
  <text x="40" y="964" font-size="11.5" fill="#9aa0a6">Jádro je v obou režimech identické — $rankFusion běží i self-hosted. Liší se jen tři adaptéry: embedding, rerank, generování (ADR-001).</text>
  <text x="40" y="984" font-size="11.5" fill="#9aa0a6">Rozdíly: $rerank je zatím Atlas-only · Citations API jen u Claude · auto-embed volá Voyage API, proto pro air-gap nepoužitelné.</text>
</svg>
