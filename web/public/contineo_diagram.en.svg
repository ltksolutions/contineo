<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1010" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5f6368"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#00897B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#D93025"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="26" font-weight="700" fill="#202124">Contineo — architecture and data flow</text>
  <text x="40" y="74" font-size="14" fill="#5f6368">CMS (channels · processing · review) → MongoDB (core) → AI adapters → interfaces. Adapters are selected by tenant configuration, not by code.</text>

  <rect x="470" y="96" width="580" height="34" rx="17" fill="#F1F3F4" stroke="#dadce0"/>
  <text x="760" y="118" font-size="13" fill="#3c4043" text-anchor="middle">Identity source and CRM (people, units, roles) · automatic user provisioning</text>
  <path d="M760,130 L760,228" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>

  <!-- CMS ako vrstva nad kanálmi a workerom -->
  <rect x="26" y="170" width="586" height="524" rx="18"
        fill="#F7F9FE" stroke="#1A73E8" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="46" y="196" font-size="15" font-weight="700" fill="#174EA6">CMS — CONTENT MANAGEMENT</text>
  <text x="46" y="215" font-size="11" fill="#5f6368">the single source of truth for content — library, versions, tags, review</text>

  <!-- VSTUPNÉ KANÁLY -->
  <rect x="40" y="236" width="264" height="372" rx="14" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="60" y="266" font-size="15" font-weight="700" fill="#174EA6">INPUT CHANNELS</text>
  <text x="60" y="285" font-size="11" fill="#5f6368">content and integrations = one layer</text>
  <g font-size="12.5" fill="#202124">
    <text x="60" y="316">• PDF regulations and directives</text>
    <text x="60" y="342">• RSS / web (general info)</text>
    <text x="60" y="368">• FAQ</text>
    <text x="60" y="394">• E-mail (IMAP)  ⇅</text>
    <text x="60" y="420">• MCP connectors</text>
    <text x="74" y="440" font-size="11" fill="#5f6368">Drive · SharePoint · Confluence</text>
    <text x="74" y="457" font-size="11" fill="#5f6368">Notion · Slack …</text>
  </g>
  <text x="60" y="496" font-size="11" fill="#1A73E8">⇅ e-mail is an output channel too</text>

  <!-- WORKER -->
  <rect x="333" y="236" width="264" height="372" rx="14" fill="#FEF3E0" stroke="#E8920C" stroke-width="1.5"/>
  <text x="353" y="266" font-size="15" font-weight="700" fill="#B05A00">WORKER</text>
  <text x="353" y="285" font-size="11" fill="#5f6368">processing (outside the DB)</text>
  <g font-size="12.5" fill="#202124">
    <text x="353" y="316">• Chunking — one excerpt per §/article</text>
    <text x="353" y="350">• Tagging from a controlled list:</text>
    <text x="367" y="369" font-size="11" fill="#5f6368">section · scope · companyCode</text>
    <text x="367" y="386" font-size="11" fill="#5f6368">version (effectiveFrom/To)</text>
    <text x="353" y="418">• Embedding at ingest</text>
    <text x="367" y="437" font-size="11" fill="#5f6368">via the adapter from the profile</text>
    <text x="353" y="469">• Versioning — old chunks</text>
    <text x="367" y="488" font-size="11" fill="#5f6368">isActive:false, never deleted</text>
  </g>

  <!-- KURÁTORSKÁ BRÁNA (v rámci CMS) -->
  <rect x="40" y="622" width="557" height="58" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="58" y="645" font-size="13.5" font-weight="700" fill="#174EA6">CURATOR — the gate before publishing</text>
  <text x="58" y="666" font-size="11.5" fill="#3c4043">tags from a controlled list → review → publish · a channel may only pre-fill; a human publishes</text>

  <!-- MongoDB JADRO -->
  <rect x="626" y="236" width="264" height="372" rx="14" fill="#E6F4EA" stroke="#137333" stroke-width="2"/>
  <text x="646" y="266" font-size="15" font-weight="700" fill="#0B6E2E">MongoDB — CORE</text>
  <text x="646" y="285" font-size="11" fill="#5f6368">same queries in cloud and on-prem</text>
  <g font-size="12.5" fill="#202124">
    <text x="646" y="316">• $vectorSearch + $search</text>
    <text x="646" y="348">• $rankFusion — hybrid</text>
    <text x="660" y="367" font-size="11" fill="#5f6368">vector 60 % + fulltext 40 %</text>
    <text x="646" y="397">• companyCode filter</text>
    <text x="660" y="416" font-size="11" fill="#5f6368">default-deny, before the LLM</text>
  </g>
  <line x1="646" y1="434" x2="870" y2="434" stroke="#A8D5B5" stroke-width="1"/>
  <text x="646" y="450" font-size="11.5" fill="#0B6E2E" font-weight="600">Collections:</text>
  <text x="646" y="468" font-size="11" fill="#3c4043">documents (+ versions) · document_chunks</text>
  <text x="646" y="485" font-size="11" fill="#3c4043">channels · channel_runs · navigation</text>
  <text x="646" y="502" font-size="11" fill="#3c4043">categories · qa_pairs · tickets</text>
  <text x="646" y="519" font-size="11" fill="#3c4043">conversations · tenant_profiles</text>
  <text x="646" y="536" font-size="10.5" fill="#3c4043">persons · acknowledgements · onboarding_tracks</text>
  <line x1="646" y1="550" x2="870" y2="550" stroke="#A8D5B5" stroke-width="1"/>
  <text x="646" y="568" font-size="10.5" fill="#0B6E2E">companyCode.parent — tenant hierarchy</text>
  <text x="646" y="583" font-size="10.5" fill="#5f6368">headquarters → subsidiaries → sites</text>
  <text x="646" y="600" font-size="10.5" fill="#5f6368">Atlas EU · or Community 8.2 on-prem</text>

  <!-- AI VRSTVA -->
  <rect x="919" y="236" width="264" height="372" rx="14" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
  <text x="939" y="266" font-size="15" font-weight="700" fill="#006064">AI LAYER — ADAPTERS</text>
  <text x="939" y="285" font-size="11" fill="#5f6368">chosen by tenant profile, not by code</text>
  <text x="939" y="315" font-size="11.5" font-weight="700" fill="#006064">EMBEDDING</text>
  <text x="939" y="333" font-size="10.5" fill="#1A73E8">cloud · Atlas auto-embed (voyage-4)</text>
  <text x="939" y="349" font-size="10.5" fill="#137333">on-prem · Infinity / TEI</text>
  <text x="939" y="381" font-size="11.5" font-weight="700" fill="#006064">RERANK</text>
  <text x="939" y="399" font-size="10.5" fill="#1A73E8">cloud · $rerank (rerank-2)</text>
  <text x="939" y="415" font-size="10.5" fill="#137333">on-prem · Infinity (BGE-v2-m3)</text>
  <text x="939" y="447" font-size="11.5" font-weight="700" fill="#006064">GENERATION</text>
  <text x="939" y="465" font-size="10.5" fill="#1A73E8">cloud · Claude (Citations API)</text>
  <text x="939" y="481" font-size="10.5" fill="#137333">on-prem · vLLM (Qwen3 / EuroLLM)</text>
  <line x1="939" y1="500" x2="1163" y2="500" stroke="#80DEEA" stroke-width="1"/>
  <text x="939" y="520" font-size="10.5" fill="#5f6368">Rerank runs on the result of</text>
  <text x="939" y="536" font-size="10.5" fill="#5f6368">$rankFusion — in the pipeline (cloud)</text>
  <text x="939" y="552" font-size="10.5" fill="#5f6368">or in the application (on-prem).</text>

  <!-- ROZHRANIA -->
  <rect x="1212" y="236" width="264" height="372" rx="14" fill="#EEE9FB" stroke="#6B46C1" stroke-width="1.5"/>
  <text x="1232" y="266" font-size="15" font-weight="700" fill="#54309E">INTERFACES</text>
  <text x="1232" y="285" font-size="11" fill="#5f6368">every answer with a citation + version</text>
  <g font-size="12.5" fill="#202124">
    <text x="1232" y="318">• Chat</text>
    <text x="1246" y="337" font-size="11" fill="#5f6368">streaming, conversation history</text>
    <text x="1232" y="369">• E-mail replies  ⇅</text>
    <text x="1246" y="388" font-size="11" fill="#5f6368">IMAP inbound and outbound</text>
    <text x="1232" y="420">• Tickets</text>
    <text x="1246" y="439" font-size="11" fill="#5f6368">helpdesk, SLA, life cycle</text>
    <text x="1232" y="471">• Embedded widget</text>
    <text x="1246" y="490" font-size="11" fill="#5f6368">overlay inside a third-party page</text>
    <text x="1232" y="522">• Portal (KB + onboarding)</text>
    <text x="1246" y="541" font-size="11" fill="#5f6368">public KB · policy acknowledgements</text>
  </g>

  <path d="M304,422 L331,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M597,422 L624,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M890,422 L917,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1183,422 L1210,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M1300,608 C1258,656 1020,664 838,614" fill="none" stroke="#00897B" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
  <path d="M1392,608 C1430,678 1064,686 880,616" fill="none" stroke="#D93025" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>

  <text x="40" y="742" font-size="15" font-weight="700" fill="#202124">Two feedback loops</text>
  <circle cx="52" cy="766" r="4.5" fill="#00897B"/>
  <text x="66" y="771" font-size="12.5" fill="#00695C"><tspan font-weight="700">① qa_pair</tspan> — an approved answer back into the knowledge base</text>
  <circle cx="52" cy="792" r="4.5" fill="#D93025"/>
  <text x="66" y="797" font-size="12.5" fill="#B31412"><tspan font-weight="700">② ticket</tspan> — escalation with the conversation context</text>

  <rect x="40" y="820" width="700" height="88" rx="12" fill="#E0F2F1" stroke="#00897B" stroke-width="1.5"/>
  <text x="60" y="848" font-size="15" font-weight="700" fill="#00695C">① CURATION — quality control</text>
  <text x="60" y="872" font-size="12.5" fill="#3c4043">An admin rates and approves an answer → it is stored as a qa_pair → embedded back.</text>
  <text x="60" y="892" font-size="12" fill="#5f6368">This is not machine „learning“, but human curation of content.</text>

  <rect x="776" y="820" width="700" height="88" rx="12" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
  <text x="796" y="848" font-size="15" font-weight="700" fill="#B31412">② ESCALATION — to a ticket</text>
  <text x="796" y="872" font-size="12.5" fill="#3c4043">Low similarity score or 3 failures on the same topic →</text>
  <text x="796" y="892" font-size="12.5" fill="#3c4043">the bot offers to create a ticket with the whole conversation context.</text>

  <text x="40" y="944" font-size="11.5" fill="#9aa0a6">Cloud: MongoDB Atlas EU · Voyage voyage-4 + rerank-2 · Claude API (Citations)  │  On-prem: MongoDB Community 8.2 · Infinity / TEI · vLLM (Qwen3 / EuroLLM)</text>
  <text x="40" y="964" font-size="11.5" fill="#9aa0a6">The core is identical in both modes — $rankFusion runs self-hosted too. Only three adapters differ: embedding, rerank, generation (ADR-001).</text>
  <text x="40" y="984" font-size="11.5" fill="#9aa0a6">Differences: $rerank is Atlas-only for now · Citations API only with Claude · auto-embed calls the Voyage API, so it is unusable in air-gap.</text>
</svg>
