<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1010" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5f6368"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#00897B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#D93025"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="26" font-weight="700" fill="#202124">Contineo — architektúra a dátový tok</text>
  <text x="40" y="74" font-size="14" fill="#5f6368">Zdroje · spracovanie · review → MongoDB (jadro) → AI adaptéry → kanály. Adaptéry sa vyberajú konfiguráciou tenanta, nie kódom.</text>

  <rect x="470" y="96" width="580" height="34" rx="17" fill="#F1F3F4" stroke="#dadce0"/>
  <text x="760" y="118" font-size="13" fill="#3c4043" text-anchor="middle">Zdroj identity a CRM (osoby, jednotky, roly) · auto-zakladanie používateľov</text>
  <path d="M760,130 L760,228" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>

  <!-- CMS ako vrstva nad kanálmi a workerom -->
  <rect x="26" y="170" width="586" height="524" rx="18"
        fill="#F7F9FE" stroke="#1A73E8" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="46" y="196" font-size="15" font-weight="700" fill="#174EA6" textLength="186" lengthAdjust="spacingAndGlyphs">CMS — SPRÁVA OBSAHU</text>
  <text x="46" y="215" font-size="11" fill="#5f6368" textLength="310" lengthAdjust="spacingAndGlyphs">jediné miesto pravdy pre obsah — knižnica, verzie, tagy, review</text>

  <!-- ZDROJE -->
  <rect x="40" y="236" width="264" height="372" rx="14" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="60" y="266" font-size="15" font-weight="700" fill="#174EA6" textLength="61" lengthAdjust="spacingAndGlyphs">ZDROJE</text>
  <text x="60" y="285" font-size="11" fill="#5f6368" textLength="181" lengthAdjust="spacingAndGlyphs">dnes: súbory, FAQ, schránka (Graph)</text>
  <g font-size="12.5" fill="#202124">
    <text x="60" y="316" textLength="216" lengthAdjust="spacingAndGlyphs">• Nahraté súbory — PDF + Word/Excel</text>
    <text x="60" y="342" fill="#9aa0a6" textLength="150" lengthAdjust="spacingAndGlyphs">• RSS / web (pripravujeme)</text>
    <text x="60" y="368">• FAQ · overené odpovede</text>
    <text x="60" y="394" textLength="182" lengthAdjust="spacingAndGlyphs">• Schránka helpdesku (Graph) ⇅</text>
    <text x="60" y="420" fill="#9aa0a6" textLength="177" lengthAdjust="spacingAndGlyphs">• MCP konektory (pripravujeme)</text>
    <text x="74" y="440" font-size="11" fill="#9aa0a6" font-style="italic" textLength="153" lengthAdjust="spacingAndGlyphs">Drive · SharePoint · Confluence</text>
    <text x="74" y="457" font-size="11" fill="#9aa0a6" font-style="italic" textLength="82" lengthAdjust="spacingAndGlyphs">Notion · Slack …</text>
  </g>
  <text x="60" y="496" font-size="11" fill="#1A73E8" textLength="158" lengthAdjust="spacingAndGlyphs">⇅ schránka je aj výstupný kanál</text>

  <!-- WORKER -->
  <rect x="333" y="236" width="264" height="372" rx="14" fill="#FEF3E0" stroke="#E8920C" stroke-width="1.5"/>
  <text x="353" y="266" font-size="15" font-weight="700" fill="#B05A00" textLength="68" lengthAdjust="spacingAndGlyphs">WORKER</text>
  <text x="353" y="285" font-size="11" fill="#5f6368" textLength="230" lengthAdjust="spacingAndGlyphs">spracovanie mimo DB · bez jazykového modelu</text>
  <g font-size="12.5" fill="#202124">
    <text x="353" y="316" textLength="90" lengthAdjust="spacingAndGlyphs">• Prevod súboru</text>
    <text x="367" y="334" font-size="10.5" fill="#5f6368" textLength="184" lengthAdjust="spacingAndGlyphs">PDF sa schvaľuje · text z Wordu/Excelu</text>
    <text x="367" y="349" font-size="10.5" fill="#5f6368" textLength="144" lengthAdjust="spacingAndGlyphs">sken → ručný prepis modelom</text>
    <text x="353" y="377" textLength="147" lengthAdjust="spacingAndGlyphs">• Členenie po článkoch / §</text>
    <text x="367" y="395" font-size="10.5" fill="#5f6368" textLength="171" lengthAdjust="spacingAndGlyphs">analyzátor zo signálov navrhne profil</text>
    <text x="367" y="410" font-size="10.5" fill="#5f6368" textLength="167" lengthAdjust="spacingAndGlyphs">FAQ po záznamoch · človek potvrdí</text>
    <text x="353" y="438" textLength="98" lengthAdjust="spacingAndGlyphs">• Metadáta úseku</text>
    <text x="367" y="456" font-size="10.5" fill="#5f6368" textLength="187" lengthAdjust="spacingAndGlyphs">companyCode · accessLevel · language</text>
    <text x="367" y="471" font-size="10.5" fill="#5f6368" textLength="177" lengthAdjust="spacingAndGlyphs">versionId · articleRef · druh z číselníka</text>
    <text x="353" y="499" textLength="72" lengthAdjust="spacingAndGlyphs">• Embedding</text>
    <text x="367" y="517" font-size="10.5" fill="#5f6368" textLength="185" lengthAdjust="spacingAndGlyphs">cloud: počíta databáza priamo v indexe</text>
    <text x="367" y="532" font-size="10.5" fill="#5f6368" textLength="140" lengthAdjust="spacingAndGlyphs">on-prem: adaptér Infinity / TEI</text>
    <text x="353" y="560" textLength="46" lengthAdjust="spacingAndGlyphs">• Znenia</text>
    <text x="367" y="578" font-size="10.5" fill="#5f6368" textLength="163" lengthAdjust="spacingAndGlyphs">účinnosť nesie dokument, nie úsek</text>
    <text x="367" y="593" font-size="10.5" fill="#5f6368" textLength="200" lengthAdjust="spacingAndGlyphs">staré členenie: superseded, nič sa nemaže</text>
  </g>

  <!-- KURÁTORSKÁ BRÁNA (v rámci CMS) -->
  <rect x="40" y="622" width="557" height="58" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="58" y="645" font-size="13.5" font-weight="700" fill="#174EA6" textLength="248" lengthAdjust="spacingAndGlyphs">KURÁTOR — brána pred publikovaním</text>
  <text x="58" y="666" font-size="11.5" fill="#3c4043" textLength="416" lengthAdjust="spacingAndGlyphs">tagy z číselníka → review → publish · kanál smie len predvyplniť, publikuje človek</text>

  <!-- MongoDB JADRO -->
  <rect x="626" y="236" width="264" height="372" rx="14" fill="#E6F4EA" stroke="#137333" stroke-width="2"/>
  <text x="646" y="266" font-size="15" font-weight="700" fill="#0B6E2E" textLength="147" lengthAdjust="spacingAndGlyphs">MongoDB — JADRO</text>
  <text x="646" y="285" font-size="11" fill="#5f6368" textLength="162" lengthAdjust="spacingAndGlyphs">rovnaké dotazy cloud aj on-prem</text>
  <g font-size="12.5" fill="#202124">
    <text x="646" y="316" textLength="148" lengthAdjust="spacingAndGlyphs">• $vectorSearch + $search</text>
    <text x="646" y="342" textLength="131" lengthAdjust="spacingAndGlyphs">• $rankFusion — hybrid</text>
    <text x="660" y="360" font-size="10.5" fill="#5f6368" textLength="129" lengthAdjust="spacingAndGlyphs">vektor 60 % + fulltext 40 %</text>
    <text x="646" y="388" textLength="93" lengthAdjust="spacingAndGlyphs">• Filter pred LLM</text>
    <text x="660" y="406" font-size="10.5" fill="#5f6368" textLength="194" lengthAdjust="spacingAndGlyphs">companyCode — vždy prvý, bez výnimky</text>
    <text x="660" y="421" font-size="10.5" fill="#5f6368" textLength="180" lengthAdjust="spacingAndGlyphs">versionId ∈ znenia platné k dňu otázky</text>
    <text x="660" y="436" font-size="10.5" fill="#5f6368" textLength="150" lengthAdjust="spacingAndGlyphs">superseded: false · accessLevel</text>
  </g>
  <line x1="646" y1="448" x2="870" y2="448" stroke="#A8D5B5" stroke-width="1"/>
  <text x="646" y="465" font-size="11.5" fill="#0B6E2E" font-weight="600" textLength="51" lengthAdjust="spacingAndGlyphs">Kolekcie:</text>
  <text x="646" y="479" font-size="10" fill="#3c4043" textLength="176" lengthAdjust="spacingAndGlyphs">Obsah: documents · document_chunks</text>
  <text x="646" y="492.5" font-size="10" fill="#3c4043" textLength="203" lengthAdjust="spacingAndGlyphs">Schvaľovanie: approval_rounds · cms_folders</text>
  <text x="646" y="506" font-size="10" fill="#3c4043" textLength="131" lengthAdjust="spacingAndGlyphs">Ľudia: persons · departments</text>
  <text x="646" y="519.5" font-size="10" fill="#3c4043" textLength="198" lengthAdjust="spacingAndGlyphs">Pridelenia: onboarding_tracks · assignments</text>
  <text x="646" y="533" font-size="10" fill="#3c4043" textLength="141" lengthAdjust="spacingAndGlyphs">Potvrdenia: acknowledgements</text>
  <text x="646" y="546.5" font-size="10" fill="#3c4043" textLength="171" lengthAdjust="spacingAndGlyphs">Helpdesk: helpdesk_channels · tickets</text>
  <text x="646" y="560" font-size="10" fill="#3c4043" textLength="181" lengthAdjust="spacingAndGlyphs">Vzdelávanie: courses · tests · certificates</text>
  <text x="646" y="573.5" font-size="10" fill="#3c4043" textLength="167" lengthAdjust="spacingAndGlyphs">Dohľad: audit · evaluations · ai_usage</text>
  <line x1="646" y1="583" x2="870" y2="583" stroke="#A8D5B5" stroke-width="1"/>
  <text x="646" y="596" font-size="10" fill="#0B6E2E" textLength="161" lengthAdjust="spacingAndGlyphs">Dôkazné záznamy sa nemenia (D24)</text>
  <text x="646" y="606" font-size="9.5" fill="#5f6368" textLength="199" lengthAdjust="spacingAndGlyphs">oprava = nový záznam · odvolanie = revokedAt</text>

  <!-- AI VRSTVA -->
  <rect x="919" y="236" width="264" height="372" rx="14" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
  <text x="939" y="266" font-size="15" font-weight="700" fill="#006064" textLength="181" lengthAdjust="spacingAndGlyphs">AI VRSTVA — ADAPTÉRY</text>
  <text x="939" y="285" font-size="11" fill="#5f6368" textLength="162" lengthAdjust="spacingAndGlyphs">výber tenant profilom, nie kódom</text>
  <text x="939" y="315" font-size="11.5" font-weight="700" fill="#006064" textLength="71" lengthAdjust="spacingAndGlyphs">EMBEDDING</text>
  <text x="939" y="333" font-size="10.5" fill="#1A73E8" textLength="171" lengthAdjust="spacingAndGlyphs">cloud · Atlas auto-embed (voyage-4)</text>
  <text x="939" y="349" font-size="10.5" fill="#137333" textLength="104" lengthAdjust="spacingAndGlyphs">on-prem · Infinity / TEI</text>
  <text x="939" y="381" font-size="11.5" font-weight="700" fill="#006064" textLength="49" lengthAdjust="spacingAndGlyphs">RERANK</text>
  <text x="939" y="399" font-size="10.5" fill="#1A73E8" textLength="118" lengthAdjust="spacingAndGlyphs">cloud · $rerank (rerank-2)</text>
  <text x="939" y="415" font-size="10.5" fill="#137333" textLength="144" lengthAdjust="spacingAndGlyphs">on-prem · Infinity (BGE-v2-m3)</text>
  <text x="939" y="447" font-size="11.5" font-weight="700" fill="#006064" textLength="83" lengthAdjust="spacingAndGlyphs">GENEROVANIE</text>
  <text x="939" y="465" font-size="10.5" fill="#1A73E8" textLength="137" lengthAdjust="spacingAndGlyphs">cloud · Claude (Citations API)</text>
  <text x="939" y="481" font-size="10.5" fill="#137333" textLength="168" lengthAdjust="spacingAndGlyphs">on-prem · vLLM (Qwen3 / EuroLLM)</text>
  <line x1="939" y1="500" x2="1163" y2="500" stroke="#80DEEA" stroke-width="1"/>
  <text x="939" y="520" font-size="10.5" fill="#5f6368" textLength="129" lengthAdjust="spacingAndGlyphs">Rerank beží nad výsledkom</text>
  <text x="939" y="536" font-size="10.5" fill="#5f6368" textLength="153" lengthAdjust="spacingAndGlyphs">$rankFusion — v pipeline (cloud)</text>
  <text x="939" y="552" font-size="10.5" fill="#5f6368" textLength="126" lengthAdjust="spacingAndGlyphs">alebo v aplikácii (on-prem).</text>

  <!-- KANÁLY -->
  <rect x="1212" y="236" width="264" height="372" rx="14" fill="#EEE9FB" stroke="#6B46C1" stroke-width="1.5"/>
  <text x="1232" y="266" font-size="15" font-weight="700" fill="#54309E" textLength="60" lengthAdjust="spacingAndGlyphs">KANÁLY</text>
  <text x="1232" y="285" font-size="11" fill="#5f6368" textLength="218" lengthAdjust="spacingAndGlyphs">dva typy · odpoveď vždy s citáciou a znením</text>
  <text x="1232" y="316" font-size="12" font-weight="700" fill="#54309E" textLength="48" lengthAdjust="spacingAndGlyphs">WIDGET</text>
  <text x="1232" y="332" font-size="10.5" fill="#5f6368" textLength="194" lengthAdjust="spacingAndGlyphs">do cudzej stránky namiesto vyhľadávania</text>
  <text x="1240" y="354" font-size="12" fill="#202124" textLength="166" lengthAdjust="spacingAndGlyphs">• Asistent — otázka a odpoveď</text>
  <text x="1254" y="369" font-size="10.5" fill="#5f6368" textLength="148" lengthAdjust="spacingAndGlyphs">vždy · podpísaná identita (ISSF)</text>
  <text x="1240" y="390" font-size="12" fill="#202124" textLength="101" lengthAdjust="spacingAndGlyphs">• Tickety (voliteľne)</text>
  <text x="1254" y="405" font-size="10.5" fill="#5f6368" textLength="201" lengthAdjust="spacingAndGlyphs">eskalácia z chatu · fronta riešiteľa · do FAQ</text>
  <text x="1240" y="426" font-size="12" fill="#202124" textLength="187" lengthAdjust="spacingAndGlyphs">• Schránka helpdesku ⇅ (voliteľne)</text>
  <text x="1254" y="441" font-size="10.5" fill="#5f6368" textLength="202" lengthAdjust="spacingAndGlyphs">e-mail = ticket · odpoveď e-mailom (Graph)</text>
  <line x1="1232" y1="458" x2="1456" y2="458" stroke="#D7CCF0" stroke-width="1"/>
  <text x="1232" y="480" font-size="12" font-weight="700" fill="#54309E" textLength="48" lengthAdjust="spacingAndGlyphs">PORTÁL</text>
  <text x="1232" y="496" font-size="10.5" fill="#5f6368" textLength="165" lengthAdjust="spacingAndGlyphs">intranet organizácie, za prihlásením</text>
  <text x="1240" y="518" font-size="12" fill="#202124" textLength="53" lengthAdjust="spacingAndGlyphs">• Knižnica</text>
  <text x="1254" y="533" font-size="10.5" fill="#5f6368" textLength="175" lengthAdjust="spacingAndGlyphs">asistent · potvrdzovanie · vzdelávanie</text>
  <text x="1240" y="554" font-size="12" fill="#9aa0a6" textLength="124" lengthAdjust="spacingAndGlyphs">• Články (pripravujeme)</text>
  <text x="1254" y="569" font-size="10.5" fill="#9aa0a6" font-style="italic" textLength="91" lengthAdjust="spacingAndGlyphs">KB články · oznamy</text>
  <text x="1240" y="590" font-size="12" fill="#9aa0a6" textLength="141" lengthAdjust="spacingAndGlyphs">• Formuláre (pripravujeme)</text>

  <path d="M304,422 L331,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M597,422 L624,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M890,422 L917,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1183,422 L1210,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M1300,608 C1258,656 1020,664 838,614" fill="none" stroke="#00897B" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
  <path d="M1392,608 C1430,678 1064,686 880,616" fill="none" stroke="#D93025" stroke-width="2.2" marker-end="url(#arrowRed)"/>

  <text x="40" y="742" font-size="15" font-weight="700" fill="#202124">Dva spätné cykly</text>
  <circle cx="52" cy="766" r="4.5" fill="#00897B"/>
  <text x="66" y="771" font-size="12.5" fill="#00695C"><tspan font-weight="700">① overená odpoveď</tspan> — späť do indexu ako úsek (sourceType qa)</text>
  <circle cx="52" cy="792" r="4.5" fill="#D93025"/>
  <text x="66" y="797" font-size="12.5" fill="#B31412"><tspan font-weight="700">② ticket</tspan> — eskalácia z chatu alebo widgetu, odpoveď e-mailom</text>

  <rect x="40" y="820" width="700" height="88" rx="12" fill="#E0F2F1" stroke="#00897B" stroke-width="1.5"/>
  <text x="60" y="848" font-size="15" font-weight="700" fill="#00695C" textLength="221" lengthAdjust="spacingAndGlyphs">① KURÁCIA — kontrola kvality</text>
  <text x="60" y="872" font-size="12.5" fill="#3c4043" textLength="487" lengthAdjust="spacingAndGlyphs">Hodnotiteľ pripraví znenie, správca obsahu ho zverejní → úsek sourceType qa v indexe.</text>
  <text x="60" y="892" font-size="12" fill="#5f6368" textLength="289" lengthAdjust="spacingAndGlyphs">Nie je to strojové „učenie“, ale ľudská kurácia obsahu.</text>

  <rect x="776" y="820" width="700" height="88" rx="12" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
  <text x="796" y="848" font-size="15" font-weight="700" fill="#B31412" textLength="190" lengthAdjust="spacingAndGlyphs">② ESKALÁCIA — na ticket</text>
  <text x="796" y="872" font-size="12.5" fill="#3c4043" textLength="564" lengthAdjust="spacingAndGlyphs">Po dvoch negatívnych hodnoteniach asistent ponúkne ticket; e-mail do schránky kanála je ticket tiež.</text>
  <text x="796" y="892" font-size="12.5" fill="#3c4043" textLength="490" lengthAdjust="spacingAndGlyphs">Riešiteľ dostane návrh odpovede, upraví ho, odošle e-mailom a môže ho pridať do FAQ.</text>

  <text x="40" y="944" font-size="11.5" fill="#9aa0a6">Cloud: MongoDB Atlas EU · Voyage voyage-4 + rerank-2 · Claude API (Citations)  │  On-prem: MongoDB Community 8.2 · Infinity / TEI · vLLM (Qwen3 / EuroLLM)</text>
  <text x="40" y="964" font-size="11.5" fill="#9aa0a6">Jadro je v oboch režimoch identické — $rankFusion beží aj self-hosted. Líšia sa len tri adaptéry: embedding, rerank, generovanie (ADR-001).</text>
  <text x="40" y="984" font-size="11.5" fill="#9aa0a6">Rozdiely: $rerank je zatiaľ Atlas-only · Citations API len pri Claude · auto-embed volá Voyage API, preto pre air-gap nepoužiteľné.</text>
</svg>
