<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1010" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5f6368"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#00897B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#D93025"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="26" font-weight="700" fill="#202124">Contineo — architektúra a dátový tok</text>
  <text x="40" y="74" font-size="14" fill="#5f6368">Zdroje · spracovanie · review → MongoDB (jadro) → AI adaptéry → kanály. Adaptéry sa vyberajú konfiguráciou tenanta, nie kódom.</text>

  <rect x="470" y="96" width="580" height="34" rx="17" fill="#F1F3F4" stroke="#dadce0"/>
  <text x="760" y="118" font-size="13" fill="#3c4043" text-anchor="middle">Zdroj identity a CRM (osoby, jednotky, roly) · auto-zakladanie používateľov</text>
  <path d="M760,130 L760,228" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>

  <!-- CMS ako vrstva nad kanálmi a workerom -->
  <rect x="26" y="170" width="586" height="524" rx="18"
        fill="#F7F9FE" stroke="#1A73E8" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="46" y="196" font-size="15" font-weight="700" fill="#174EA6">CMS — SPRÁVA OBSAHU</text>
  <text x="46" y="215" font-size="11" fill="#5f6368">jediné miesto pravdy pre obsah — knižnica, verzie, tagy, review</text>

  <!-- ZDROJE -->
  <rect x="40" y="236" width="264" height="372" rx="14" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="60" y="266" font-size="15" font-weight="700" fill="#174EA6">ZDROJE</text>
  <text x="60" y="285" font-size="11" fill="#5f6368">dnes: súbory, FAQ, schránka (Graph)</text>
  <g font-size="12.5" fill="#202124">
    <text x="60" y="316">• Nahraté súbory — PDF + Word/Excel</text>
    <text x="60" y="342" fill="#9aa0a6">• RSS / web (pripravujeme)</text>
    <text x="60" y="368">• FAQ (druh dokumentu) · overené odpovede</text>
    <text x="60" y="394">• Schránka helpdesku (Graph) ⇅</text>
    <text x="60" y="420" fill="#9aa0a6">• MCP konektory (pripravujeme)</text>
    <text x="74" y="440" font-size="11" fill="#9aa0a6" font-style="italic">Drive · SharePoint · Confluence</text>
    <text x="74" y="457" font-size="11" fill="#9aa0a6" font-style="italic">Notion · Slack …</text>
  </g>
  <text x="60" y="496" font-size="11" fill="#1A73E8">⇅ schránka je aj výstupný kanál</text>

  <!-- WORKER -->
  <rect x="333" y="236" width="264" height="372" rx="14" fill="#FEF3E0" stroke="#E8920C" stroke-width="1.5"/>
  <text x="353" y="266" font-size="15" font-weight="700" fill="#B05A00">WORKER</text>
  <text x="353" y="285" font-size="11" fill="#5f6368">spracovanie mimo DB · bez jazykového modelu</text>
  <g font-size="12.5" fill="#202124">
    <text x="353" y="316">• Prevod súboru</text>
    <text x="367" y="334" font-size="10.5" fill="#5f6368">PDF sa schvaľuje · text z Wordu/Excelu</text>
    <text x="367" y="349" font-size="10.5" fill="#5f6368">sken → ručný prepis modelom</text>
    <text x="353" y="377">• Členenie po článkoch / §</text>
    <text x="367" y="395" font-size="10.5" fill="#5f6368">analyzátor zo signálov navrhne profil</text>
    <text x="367" y="410" font-size="10.5" fill="#5f6368">FAQ po záznamoch · človek potvrdí</text>
    <text x="353" y="438">• Metadáta úseku</text>
    <text x="367" y="456" font-size="10.5" fill="#5f6368">companyCode · accessLevel · language</text>
    <text x="367" y="471" font-size="10.5" fill="#5f6368">versionId · articleRef · druh z číselníka</text>
    <text x="353" y="499">• Embedding</text>
    <text x="367" y="517" font-size="10.5" fill="#5f6368">cloud: počíta databáza priamo v indexe</text>
    <text x="367" y="532" font-size="10.5" fill="#5f6368">on-prem: adaptér Infinity / TEI</text>
    <text x="353" y="560">• Znenia</text>
    <text x="367" y="578" font-size="10.5" fill="#5f6368">účinnosť nesie dokument, nie úsek</text>
    <text x="367" y="593" font-size="10.5" fill="#5f6368">staré členenie: superseded, nič sa nemaže</text>
  </g>

  <!-- KURÁTORSKÁ BRÁNA (v rámci CMS) -->
  <rect x="40" y="622" width="557" height="58" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="58" y="645" font-size="13.5" font-weight="700" fill="#174EA6">KURÁTOR — brána pred publikovaním</text>
  <text x="58" y="666" font-size="11.5" fill="#3c4043">tagy z číselníka → review → publish · kanál smie len predvyplniť, publikuje človek</text>

  <!-- MongoDB JADRO -->
  <rect x="626" y="236" width="264" height="372" rx="14" fill="#E6F4EA" stroke="#137333" stroke-width="2"/>
  <text x="646" y="266" font-size="15" font-weight="700" fill="#0B6E2E">MongoDB — JADRO</text>
  <text x="646" y="285" font-size="11" fill="#5f6368">rovnaké dotazy cloud aj on-prem</text>
  <g font-size="12.5" fill="#202124">
    <text x="646" y="316">• $vectorSearch + $search</text>
    <text x="646" y="342">• $rankFusion — hybrid</text>
    <text x="660" y="360" font-size="10.5" fill="#5f6368">vektor 60 % + fulltext 40 %</text>
    <text x="646" y="388">• Filter pred LLM</text>
    <text x="660" y="406" font-size="10.5" fill="#5f6368">companyCode — vždy prvý, bez výnimky</text>
    <text x="660" y="421" font-size="10.5" fill="#5f6368">versionId ∈ znenia platné k dňu otázky</text>
    <text x="660" y="436" font-size="10.5" fill="#5f6368">superseded: false · accessLevel</text>
  </g>
  <line x1="646" y1="448" x2="870" y2="448" stroke="#A8D5B5" stroke-width="1"/>
  <text x="646" y="465" font-size="11.5" fill="#0B6E2E" font-weight="600">Kolekcie:</text>
  <text x="646" y="479" font-size="10" fill="#3c4043">Obsah: documents · document_chunks</text>
  <text x="646" y="492.5" font-size="10" fill="#3c4043">Schvaľovanie: approval_rounds · cms_folders</text>
  <text x="646" y="506" font-size="10" fill="#3c4043">Ľudia: persons · departments</text>
  <text x="646" y="519.5" font-size="10" fill="#3c4043">Pridelenia: onboarding_tracks · assignments</text>
  <text x="646" y="533" font-size="10" fill="#3c4043">Potvrdenia: acknowledgements</text>
  <text x="646" y="546.5" font-size="10" fill="#3c4043">Helpdesk: helpdesk_channels · tickets</text>
  <text x="646" y="560" font-size="10" fill="#3c4043">Vzdelávanie: courses · tests · certificates</text>
  <text x="646" y="573.5" font-size="10" fill="#3c4043">Dohľad: audit · evaluations · ai_usage</text>
  <line x1="646" y1="583" x2="870" y2="583" stroke="#A8D5B5" stroke-width="1"/>
  <text x="646" y="596" font-size="10" fill="#0B6E2E">Dôkazné záznamy sa nemenia (D24)</text>
  <text x="646" y="606" font-size="9.5" fill="#5f6368">oprava = nový záznam · odvolanie = revokedAt</text>

  <!-- AI VRSTVA -->
  <rect x="919" y="236" width="264" height="372" rx="14" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
  <text x="939" y="266" font-size="15" font-weight="700" fill="#006064">AI VRSTVA — ADAPTÉRY</text>
  <text x="939" y="285" font-size="11" fill="#5f6368">výber tenant profilom, nie kódom</text>
  <text x="939" y="315" font-size="11.5" font-weight="700" fill="#006064">EMBEDDING</text>
  <text x="939" y="333" font-size="10.5" fill="#1A73E8">cloud · Atlas auto-embed (voyage-4)</text>
  <text x="939" y="349" font-size="10.5" fill="#137333">on-prem · Infinity / TEI</text>
  <text x="939" y="381" font-size="11.5" font-weight="700" fill="#006064">RERANK</text>
  <text x="939" y="399" font-size="10.5" fill="#1A73E8">cloud · $rerank (rerank-2)</text>
  <text x="939" y="415" font-size="10.5" fill="#137333">on-prem · Infinity (BGE-v2-m3)</text>
  <text x="939" y="447" font-size="11.5" font-weight="700" fill="#006064">GENEROVANIE</text>
  <text x="939" y="465" font-size="10.5" fill="#1A73E8">cloud · Claude (Citations API)</text>
  <text x="939" y="481" font-size="10.5" fill="#137333">on-prem · vLLM (Qwen3 / EuroLLM)</text>
  <line x1="939" y1="500" x2="1163" y2="500" stroke="#80DEEA" stroke-width="1"/>
  <text x="939" y="520" font-size="10.5" fill="#5f6368">Rerank beží nad výsledkom</text>
  <text x="939" y="536" font-size="10.5" fill="#5f6368">$rankFusion — v pipeline (cloud)</text>
  <text x="939" y="552" font-size="10.5" fill="#5f6368">alebo v aplikácii (on-prem).</text>

  <!-- KANÁLY -->
  <rect x="1212" y="236" width="264" height="372" rx="14" fill="#EEE9FB" stroke="#6B46C1" stroke-width="1.5"/>
  <text x="1232" y="266" font-size="15" font-weight="700" fill="#54309E">KANÁLY</text>
  <text x="1232" y="285" font-size="11" fill="#5f6368">dva typy: widget a portál · vždy s citáciou</text>
  <g font-size="12.5" fill="#202124">
    <text x="1232" y="318">• Widget — do cudzej stránky</text>
    <text x="1246" y="337" font-size="11" fill="#5f6368">asistent · podpísaná identita (ISSF)</text>
    <text x="1232" y="369">• Widget: tickety (voliteľne)</text>
    <text x="1246" y="388" font-size="11" fill="#5f6368">eskalácia z chatu · fronta riešiteľa · do FAQ</text>
    <text x="1232" y="420">• Widget: schránka helpdesku ⇅ (voliteľne)</text>
    <text x="1246" y="439" font-size="11" fill="#5f6368">e-mail = ticket · odpoveď e-mailom (Graph)</text>
    <text x="1232" y="471">• Portál — knižnica</text>
    <text x="1246" y="490" font-size="11" fill="#5f6368">články a formuláre (pripravujeme)</text>
    <text x="1232" y="522">• Intranet (vstavané)</text>
    <text x="1246" y="541" font-size="11" fill="#5f6368">asistent · knižnica · potvrdzovanie · vzdelávanie</text>
  </g>

  <path d="M304,422 L331,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M597,422 L624,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M890,422 L917,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1183,422 L1210,422" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M1300,608 C1258,656 1020,664 838,614" fill="none" stroke="#00897B" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
  <path d="M1392,608 C1430,678 1064,686 880,616" fill="none" stroke="#D93025" stroke-width="2.2" marker-end="url(#arrowRed)"/>

  <text x="40" y="742" font-size="15" font-weight="700" fill="#202124">Dva spätné cykly</text>
  <circle cx="52" cy="766" r="4.5" fill="#00897B"/>
  <text x="66" y="771" font-size="12.5" fill="#00695C"><tspan font-weight="700">① overená odpoveď</tspan> — späť do indexu ako úsek (sourceType qa)</text>
  <circle cx="52" cy="792" r="4.5" fill="#D93025"/>
  <text x="66" y="797" font-size="12.5" fill="#B31412"><tspan font-weight="700">② ticket</tspan> — eskalácia z chatu alebo widgetu, odpoveď e-mailom</text>

  <rect x="40" y="820" width="700" height="88" rx="12" fill="#E0F2F1" stroke="#00897B" stroke-width="1.5"/>
  <text x="60" y="848" font-size="15" font-weight="700" fill="#00695C">① KURÁCIA — kontrola kvality</text>
  <text x="60" y="872" font-size="12.5" fill="#3c4043">Hodnotiteľ pripraví znenie, správca obsahu ho zverejní → úsek sourceType qa v indexe.</text>
  <text x="60" y="892" font-size="12" fill="#5f6368">Nie je to strojové „učenie“, ale ľudská kurácia obsahu.</text>

  <rect x="776" y="820" width="700" height="88" rx="12" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
  <text x="796" y="848" font-size="15" font-weight="700" fill="#B31412">② ESKALÁCIA — na ticket</text>
  <text x="796" y="872" font-size="12.5" fill="#3c4043">Po dvoch negatívnych hodnoteniach asistent ponúkne ticket; e-mail do schránky kanála je ticket tiež.</text>
  <text x="796" y="892" font-size="12.5" fill="#3c4043">Riešiteľ dostane návrh odpovede, upraví ho, odošle e-mailom a môže ho pridať do FAQ.</text>

  <text x="40" y="944" font-size="11.5" fill="#9aa0a6">Cloud: MongoDB Atlas EU · Voyage voyage-4 + rerank-2 · Claude API (Citations)  │  On-prem: MongoDB Community 8.2 · Infinity / TEI · vLLM (Qwen3 / EuroLLM)</text>
  <text x="40" y="964" font-size="11.5" fill="#9aa0a6">Jadro je v oboch režimoch identické — $rankFusion beží aj self-hosted. Líšia sa len tri adaptéry: embedding, rerank, generovanie (ADR-001).</text>
  <text x="40" y="984" font-size="11.5" fill="#9aa0a6">Rozdiely: $rerank je zatiaľ Atlas-only · Citations API len pri Claude · auto-embed volá Voyage API, preto pre air-gap nepoužiteľné.</text>
</svg>
